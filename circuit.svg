<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#14213D">Robonauts Assistant: circuit diagram</text>

  <!-- ===== OLED ===== -->
  <rect x="60" y="80" width="190" height="140" rx="10" fill="#1d3b8f"/>
  <rect x="80" y="100" width="110" height="100" rx="4" fill="#0b0f1a"/>
  <circle cx="113" cy="140" r="12" fill="#bfe3ff"/><circle cx="157" cy="140" r="12" fill="#bfe3ff"/>
  <rect x="122" y="168" width="26" height="5" rx="2" fill="#bfe3ff"/>
  <text x="135" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">0.96" OLED SSD1306</text>
  <text x="135" y="257" text-anchor="middle" font-size="12" fill="#555">I2C address 0x3C</text>
  <g font-size="12" fill="#fff" font-weight="700">
    <text x="243" y="114" text-anchor="end">GND</text><text x="243" y="139" text-anchor="end">VCC</text>
    <text x="243" y="164" text-anchor="end">SCL</text><text x="243" y="189" text-anchor="end">SDA</text>
  </g>

  <!-- ===== ESP32 ===== -->
  <rect x="400" y="70" width="210" height="400" rx="10" fill="#2b2b2b"/>
  <rect x="455" y="250" width="100" height="80" rx="4" fill="#9aa0a6"/>
  <text x="505" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#222">ESP32</text>
  <text x="505" y="302" text-anchor="middle" font-size="11" fill="#222">DevKit V1</text>
  <rect x="480" y="450" width="50" height="22" rx="3" fill="#c0c0c0"/>
  <text x="505" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#222">USB</text>
  <rect x="420" y="420" width="34" height="18" rx="3" fill="#666"/><text x="437" y="433" text-anchor="middle" font-size="10" fill="#fff">EN</text>
  <rect x="556" y="420" width="40" height="18" rx="3" fill="#666"/><text x="576" y="433" text-anchor="middle" font-size="10" fill="#fff">BOOT</text>
  <g font-size="12" fill="#fff" font-weight="700">
    <text x="408" y="114">GND</text><text x="408" y="139">3V3</text><text x="408" y="164">D22</text><text x="408" y="189">D21</text>
    <text x="408" y="384">VIN</text>
    <text x="602" y="114" text-anchor="end">D25</text><text x="602" y="139" text-anchor="end">D26</text>
    <text x="602" y="164" text-anchor="end">D27</text><text x="602" y="189" text-anchor="end">D32</text>
    <text x="602" y="214" text-anchor="end">D33</text><text x="602" y="239" text-anchor="end">D13</text>
    <text x="602" y="264" text-anchor="end">GND</text>
  </g>

  <!-- OLED wires -->
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="250" y1="110" x2="400" y2="110" stroke="#000"/>
    <line x1="250" y1="135" x2="400" y2="135" stroke="#e53935"/>
    <line x1="250" y1="160" x2="400" y2="160" stroke="#f9a825"/>
    <line x1="250" y1="185" x2="400" y2="185" stroke="#2e7d32"/>
  </g>

  <!-- ===== L298N ===== -->
  <rect x="740" y="80" width="190" height="270" rx="10" fill="#c62828"/>
  <rect x="790" y="150" width="90" height="70" rx="4" fill="#222"/>
  <text x="835" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">L298N</text>
  <g font-size="12" fill="#fff" font-weight="700">
    <text x="748" y="114">ENA</text><text x="748" y="139">IN1</text><text x="748" y="164">IN2</text>
    <text x="748" y="189">IN3</text><text x="748" y="214">IN4</text><text x="748" y="239">ENB</text><text x="748" y="264">GND</text>
    <text x="922" y="129" text-anchor="end">OUT1</text><text x="922" y="154" text-anchor="end">OUT2</text>
    <text x="922" y="254" text-anchor="end">OUT3</text><text x="922" y="279" text-anchor="end">OUT4</text>
    <text x="770" y="340" text-anchor="middle">VS</text><text x="835" y="340" text-anchor="middle">GND</text><text x="900" y="340" text-anchor="middle">5V</text>
  </g>
  <!-- control wires -->
  <g stroke-width="3.5" fill="none" stroke-linecap="round">
    <line x1="610" y1="110" x2="740" y2="110" stroke="#8e24aa"/>
    <line x1="610" y1="135" x2="740" y2="135" stroke="#1e88e5"/>
    <line x1="610" y1="160" x2="740" y2="160" stroke="#1e88e5"/>
    <line x1="610" y1="185" x2="740" y2="185" stroke="#00897b"/>
    <line x1="610" y1="210" x2="740" y2="210" stroke="#00897b"/>
    <line x1="610" y1="235" x2="740" y2="235" stroke="#8e24aa"/>
    <line x1="610" y1="260" x2="740" y2="260" stroke="#000" stroke-width="4"/>
  </g>
  <text x="675" y="290" text-anchor="middle" font-size="11" fill="#333">common ground</text>

  <!-- ===== Motors ===== -->
  <g stroke-width="4" fill="none">
    <polyline points="930,125 980,125 980,150" stroke="#e53935"/>
    <polyline points="930,150 965,150 965,170" stroke="#000"/>
    <polyline points="930,250 980,250 980,275" stroke="#e53935"/>
    <polyline points="930,275 965,275 965,295" stroke="#000"/>
  </g>
  <circle cx="1010" cy="185" r="38" fill="#f9c80e" stroke="#333" stroke-width="2"/>
  <text x="1010" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#333">M</text>
  <text x="1010" y="200" text-anchor="middle" font-size="11" fill="#333">LEFT</text>
  <circle cx="1010" cy="310" r="38" fill="#f9c80e" stroke="#333" stroke-width="2"/>
  <text x="1010" y="307" text-anchor="middle" font-size="18" font-weight="700" fill="#333">M</text>
  <text x="1010" y="325" text-anchor="middle" font-size="11" fill="#333">RIGHT</text>
  <line x1="980" y1="150" x2="985" y2="160" stroke="#e53935" stroke-width="4"/>
  <line x1="965" y1="170" x2="975" y2="175" stroke="#000" stroke-width="4"/>
  <line x1="980" y1="275" x2="985" y2="285" stroke="#e53935" stroke-width="4"/>
  <line x1="965" y1="295" x2="975" y2="300" stroke="#000" stroke-width="4"/>

  <!-- ===== Power ===== -->
  <rect x="60" y="440" width="200" height="90" rx="12" fill="#37474f"/>
  <text x="160" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Power bank</text>
  <text x="160" y="500" text-anchor="middle" font-size="12" fill="#cfd8dc">5 V USB</text>
  <polyline points="260,485 505,485 505,472" stroke="#555" stroke-width="6" fill="none"/>
  <text x="380" y="505" text-anchor="middle" font-size="12" fill="#333">USB cable (powers ESP32 + OLED)</text>

  <rect x="700" y="470" width="230" height="80" rx="10" fill="#1565c0"/>
  <text x="815" y="503" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2× 18650 battery</text>
  <text x="815" y="523" text-anchor="middle" font-size="12" fill="#e3f2fd">7.4 V (recommended for motors)</text>
  <polyline points="740,470 740,420 770,420 770,350" stroke="#e53935" stroke-width="4" fill="none"/>
  <polyline points="890,470 890,400 835,400 835,350" stroke="#000" stroke-width="4" fill="none"/>
  <text x="726" y="445" text-anchor="end" font-size="12" font-weight="700" fill="#e53935">+</text>
  <text x="905" y="445" font-size="12" font-weight="700" fill="#000">−</text>

  <!-- test-power note -->
  <polyline points="400,380 360,380 360,600 700,600" stroke="#e53935" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <text x="372" y="590" font-size="12" fill="#c62828">Testing only (no battery): ESP32 VIN → L298N VS and 5V, remove the 5V jumper</text>

  <!-- legend -->
  <g font-size="12" fill="#333">
    <rect x="60" y="300" width="250" height="120" rx="8" fill="#f5f7fb" stroke="#d0d7e2"/>
    <text x="72" y="322" font-weight="700">Wire colours</text>
    <line x1="72" y1="340" x2="102" y2="340" stroke="#e53935" stroke-width="4"/><text x="110" y="344">Power (+)</text>
    <line x1="190" y1="340" x2="220" y2="340" stroke="#000" stroke-width="4"/><text x="228" y="344">Ground</text>
    <line x1="72" y1="362" x2="102" y2="362" stroke="#f9a825" stroke-width="4"/><text x="110" y="366">SCL</text>
    <line x1="190" y1="362" x2="220" y2="362" stroke="#2e7d32" stroke-width="4"/><text x="228" y="366">SDA</text>
    <line x1="72" y1="384" x2="102" y2="384" stroke="#8e24aa" stroke-width="4"/><text x="110" y="388">Speed (PWM)</text>
    <line x1="190" y1="384" x2="220" y2="384" stroke="#1e88e5" stroke-width="4"/><text x="228" y="388">Direction</text>
    <text x="72" y="408">Remove the ENA / ENB jumper caps</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
